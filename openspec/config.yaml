schema: spec-driven

context: |
  Language: ko
  All artifacts must be written in ko.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Poom (품) — 한부모 + 자녀 전용 쉐어룸 웹 (PWA). 한국어 · 영어.
  서류 1장(등본 또는 한부모가족 증명서 / 외국인등록사실증명)으로 신청하고, 적은 보증금으로, 빈방이면 빠르면 당일 입주.
  기획 원본: docs/Proposal/ (요구사항 REQ_ · 정책 POL_ · 화면 SCR_ · API API_ · 로그 evt_ · 테스트 TC_)

  기술 스택:
  - 화면: React + Vite + TypeScript, PWA
  - 서버: Cloudflare Workers, DB: Cloudflare D1, 파일: Cloudflare R2 (서류 · 계약서는 비공개)
  - 배포: Cloudflare Pages — dist/ 만 배포 (docs/ · openspec/ · tests/ 공개 금지)
  - 다국어: i18n/ko.json · i18n/en.json (같은 키)
  - 데이터 원본: JSON + JSON Schema (CSV 쓰지 않음)

  개발 단계 (Mock-First):
  - Phase 1 (USE_MOCK=true): data/*.json + 인메모리 저장소, 본인인증 · 전자계약 · PG · 문자는 가짜 어댑터. 외부 가입 없이 전체 흐름(방 찾기 → 신청 → 상담 승인 → 계약 → 결제 → 입주 안내) 완성
  - Phase 2 (USE_MOCK=false): D1 · R2 · 실제 본인인증 · PG · 문자 연결. 화면 코드는 바꾸지 않음

rules:
  proposal:
    - 관련 REQ_ · POL_ · SCR_ ID를 적는다 (docs/Proposal/ 링크)
    - 하지 않는 것(범위 밖)을 적는다
    - 신청 · 입주 단계나 제출 서류를 늘리는 변경이면 이유를 따로 적는다
  specs:
    - 명세는 사용자가 보는 동작과 결과로 쓴다. 내부 구현은 design.md · tasks.md에 쓴다
    - 요구사항마다 WHEN/THEN 시나리오를 하나 이상 둔다
    - 화면 문구가 있으면 한국어 · 영어 둘 다 적는다
    - 권한(비로그인 · 신청자 · 입주자 · 운영 매니저)과 개인정보(주소 · 서류 · 자녀 정보) 노출 조건을 시나리오로 적는다
  design:
    - 화면은 모드(Mock / Real)를 몰라야 한다 — 같은 API 응답 형식 { success, data?, error? }
    - 외부 서비스(본인인증 · 전자계약 · PG · 문자)는 어댑터 인터페이스 뒤에 둔다
    - 이름 · 전화번호 · 상담 메모는 암호화, 로그 · 분석에 개인정보를 넣지 않는다
  tasks:
    - 도메인 · API를 바꾸면 Given-When-Then 테스트를 먼저 추가한다
    - 화면을 바꾸면 브라우저(모바일 360px · 한국어 · 영어)에서 직접 확인하는 작업을 넣는다
    - 새 화면 · 버튼 · 화면 이동에는 3분 기록(note) 지점을 넣는 작업을 둔다 (입력값 기록 금지)
    - 화면을 바꾸면 의견 · 신고 버튼이 그 화면에서 동작하는지 확인하는 작업을 넣는다
    - 마지막 작업은 docs/Proposal/ 해당 문서(요구사항 · 화면 · 정책 · QA) 반영

operations:
  apply:
    guidance:
      - 테스트 하나가 통과할 때마다 커밋한다 (Conventional Commits, 한국어 메시지)
      - 배포는 테스트판(dev)에만 한다. 운영판(main)은 대표 승인 후
  archive:
    guidance:
      - 아카이브 전에 docs/Proposal/ 와 명세가 일치하는지 확인한다
